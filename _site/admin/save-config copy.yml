backend:
  name: github
  repo: florianchapon/website
  branch: gh-pages

publish_mode: editorial_workflow

media_folder: "uploads"

collections:
  - name: "websitesettings" # Settings site
    label: "Settings du site"
    files:
      - label: "Settings"
        name: "settings"
        file: "_config.yml"
        fields:
          - {label: "titre", name: "title", widget: "string"}
          - {label : "email", name: "email", widget: "string"}
          - {label : "Description", name: "description", widget: "string"}
          - label: "Footer info"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
              - label: "social"
                name: "social"
                widget: "list"
                fields:
                  - {label: "Icone font-awesome", name: "icon", widget: "string"}
                  - {label: "Nom du lien", name: "name", widget: "string"}
                  - {label: "Lien réseaux social", name: "link", widget: "string"}

  - name: "Articles"
    label: "Articles"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: # The fields for each document, usually in front matter
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Auteur", name: "author", widget: "string"}
      - {label: "Image d'en tête", name: "image", widget: "image"}
      - {label: "Texte", name: "body", widget: "markdown"}

  - name: "Page"
    label: "Pages"
    folder: "_pages"
    layout: page
    create: true
    slug: "{{slug}}"
    fields: # The fields for each pages
      - {label: "Titre", name: "titre", widget: "string"}
      - {label: "Image bannière", name: "banniere", widget: "image"}
      - {label: "Texte", name: "body", widget: "markdown"}
  
  - name: "homepage"
    label: "Home page"
    files:
      - label: "Home page"
        name: "home"
        file: "index.md"
        fields: # Fields of the home page
          - label: "Hero header" # Field de la catégorie bannière 
            name: "heroheader"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "markdown"}
              - {label: "Sous-titre", name: "subtitle", widget: "markdown"}
              - {label: "Image", name: "image", widget: "image"}
          - label: "Background"
            name: "background"
            widget: "object"
            fields:    
              - label : "Background-jobs" # Services
                name: "background-jobs"
                widget: "list"
                fields: 
                  - {label: "Image emploi", name: "image", widget: "string"} 
                  - {label: "Titre emploi", name: "title", widget: "string"} 
                  - {label: "Entreprise", name: "company", widget: "string"} 
                  - {label: "Lien entreprise", name: "link", widget: "string"}
                  - {label: "Lieu", name: "place", widget: "string"}
                  - {label: "Date de fin", name: "end-date", widget: "string"}
                  - {label: "Date de début", name: "start-date", widget: "string"}
                  - {label: "Description emploi", name: "description", widget: "markdown"}
              - label : "Background-education" # Services
                name: "background-education"
                widget: "list"
                fields: 
                  - {label: "Diplome", name: "degree", widget: "string"} 
                  - {label: "Specialite", name: "specialty", widget: "string"} 
                  - {label: "Lieu", name: "place", widget: "markdown"}   
              - {label: "Lien CV", name: "cvlink", widget: "file" }

              

  - name: "projets"
    label: "Projets"
    folder: "_projets"
    create: true
    layout: project
    slug: "{{slug}}"
    fields: # The fields for each document, usually in front matter
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Image d'en tête", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "markdown"}
      - label: "Gallerie"
        name: "gallerie"
        widget: "list"
        required: false
        fields:
          - {label: "Image", name: "image", widget: "image"}
          - {label: "Titre de l'image", name: "titre", widget: "string"}             
      - {label: "Texte", name: "body", widget: "markdown"}